name: Operations Intelligence release gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install exact TypeScript build tool
        run: npm install --global typescript@5.8.3
      - name: Install exact browser QA tool
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install chromium
      - name: Generate deterministic demo data
        run: python tools/generate_demo_data.py
      - name: Build production bundle
        run: python tools/build.py
      - name: Analytical and browser-module tests
        run: node tests/run_tests.mjs
      - name: Durable-store and ingestion tests
        run: python tests/platform_foundation_test.py
      - name: One-active-launcher contract
        run: python tests/release_contract_test.py
      - name: Loopback HTTP and RBAC smoke tests
        run: python tests/http_smoke.py
      - name: Fail-closed release verification
        run: python tools/verify_release.py
      - name: Compiled desktop/mobile browser acceptance
        run: python tests/browser_render_harness.py
      - name: Package and integrity-test release
        run: python tools/package_release.py --output-dir release-output
      - name: Archive verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operations-intelligence-verification
          path: |
            reports/*.json
            reports/browser/*.png
            release-output/*.sha256.txt
          if-no-files-found: error
